# GitHub Actions workflow: create a branch + PR when an issue is labeled "replit-ready".
# Ensures the new branch has at least one commit by creating a placeholder
# file in .github/replit-placeholders/ to avoid conflicts with a possible .replit file.

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  issues:
    types: [labeled]

jobs:
  create_branch_and_pr:
    if: github.event.label && github.event.label.name == 'replit-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Create branch, add placeholder commit, and open PR
        uses: actions/github-script@v6
        with:
          script: |
            const label = context.payload.label && context.payload.label.name;
            if (label !== 'replit-ready') {
              console.log(`Label is "${label}" — nothing to do.`);
              return;
            }

            const issue_number = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get default branch and its commit SHA
            const { data: repoData } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repoData.default_branch;
            const { data: branchData } = await github.rest.repos.getBranch({ owner, repo, branch: defaultBranch });
            const sha = branchData.commit.sha;

            // Prepare branch name
            let branchName = `replit/issue-${issue_number}`;

            // Create branch ref from default branch commit SHA. If branch exists, append timestamp
            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha });
              console.log(`Created branch ${branchName} from ${defaultBranch}@${sha}`);
            } catch (err) {
              console.log(`createRef failed: ${err.message}`);
              branchName = `${branchName}-${Date.now()}`;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha });
              console.log(`Created branch ${branchName} instead`);
            }

            // Create a unique placeholder file path under .github to avoid conflicts with .replit file
            const timestamp = Date.now();
            const basePath = `.github/replit-placeholders`;
            let placeholderPath = `${basePath}/issue-${issue_number}-${timestamp}.md`;
            const placeholderContent = `# Placeholder for issue #${issue_number}\n\nCreated by workflow at ${new Date().toISOString()}\n`;
            const contentBase64 = Buffer.from(placeholderContent, 'utf8').toString('base64');

            // Try to create the file; if a conflict occurs, retry with a new timestamped name
            let created = false;
            for (let attempt = 0; attempt < 3 && !created; attempt++) {
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: placeholderPath,
                  message: `chore: add placeholder for issue #${issue_number}`,
                  content: contentBase64,
                  branch: branchName
                });
                created = true;
                console.log(`Added placeholder file ${placeholderPath} on ${branchName}`);
              } catch (err) {
                // If file exists or other conflict, pick a new unique path and retry
                console.log(`Failed to create ${placeholderPath}: ${err.message}`);
                placeholderPath = `${basePath}/issue-${issue_number}-${Date.now()}-${attempt}.md`;
              }
            }

            if (!created) {
              throw new Error('Could not create placeholder file after several attempts');
            }

            // Create a PR from the new branch to the default branch
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: `Replit-ready: work for issue #${issue_number}`,
              head: branchName,
              base: defaultBranch,
              body: `Automated PR created from issue #${issue_number} labeled "replit-ready".\n\nCloses #${issue_number}`
            });

            console.log(`Created PR: ${pr.html_url}`);

            // Post PR link back to the issue
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `Created PR: ${pr.html_url}`
            });
