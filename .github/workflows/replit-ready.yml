# Create a feature branch + placeholder commit + PR when an issue is labeled "replit-ready".
# Behavior:
# - Trigger: issue labeled
# - Only runs when the added label is exactly "replit-ready"
# - Requires an existing issue label that starts with "dev" (case-insensitive). If no such label is found the workflow comments on the issue and exits (it WILL NOT target the default branch).
# - Uses the found dev-* label value (sanitized) as the base branch for the PR.
# - Creates a feature branch named replit/issue-<number> (appends timestamp if exists), adds a placeholder file to ensure at least one commit, opens a PR against the dev branch, updates PR body to include repo-qualified "Closes owner/repo#N", and comments on the issue.
#
# Notes:
# - Workflows must have write permission to contents, issues and pull-requests.
# - The dev label must already exist on the issue (e.g. "Dev_26.2" or "dev-26.2"); the workflow will not create the dev branch for you.

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  issues:
    types: [labeled]

jobs:
  create_branch_and_pr:
    if: github.event.label && github.event.label.name == 'replit-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Create branch, add placeholder commit, and open PR targeting Dev_* branch
        uses: actions/github-script@v6
        with:
          script: |
            (async () => {
              try {
                // Only proceed when the added label is exactly 'replit-ready'
                const addedLabel = context.payload.label && context.payload.label.name;
                if (addedLabel !== 'replit-ready') {
                  console.log(`Added label is "${addedLabel}" — nothing to do.`);
                  return;
                }

                const issue = context.payload.issue || {};
                const issue_number = issue.number;
                const owner = context.repo.owner;
                const repo = context.repo.repo;

                // Find an issue label that starts with "dev" (case-insensitive)
                const labels = issue.labels || [];
                let rawBase = null;
                for (const l of labels) {
                  const name = (l && l.name) || '';
                  if (/^dev/i.test(name)) {
                    rawBase = name.trim();
                    console.log(`Selected dev label "${rawBase}" as target base branch`);
                    break;
                  }
                }

                // If no dev-* label found, comment and exit (do NOT fall back to default branch)
                if (!rawBase) {
                  const msg = 'No label starting with "dev" found on this issue. Please add a label beginning with "dev" (for example "Dev_26.2") before adding "replit-ready". The workflow will not open a PR otherwise.';
                  console.log(msg);
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body: msg
                  });
                  return;
                }

                // Sanitize base branch name: replace spaces, remove unsafe chars except . _ - / 
                let baseBranch = rawBase.replace(/\s+/g, '_').replace(/[^A-Za-z0-9._\-\/]/g, '');
                // trim leading/trailing ., -, /
                baseBranch = baseBranch.replace(/^[-.\/]+|[-.\/]+$/g, '');
                if (!baseBranch) {
                  const msg = `Derived base branch name from label "${rawBase}" is empty after sanitization. Please use a simpler label.`;
                  console.log(msg);
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
                  return;
                }

                // Verify base branch exists; if not, inform and stop (no fallback)
                try {
                  await github.rest.repos.getBranch({ owner, repo, branch: baseBranch });
                } catch (err) {
                  const msg = `Target branch "${baseBranch}" (from label "${rawBase}") does not exist. Please create it or use an existing dev-* label.`;
                  console.log(msg);
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body: msg
                  });
                  return;
                }

                // Get commit SHA of the base branch to create the feature branch from
                const { data: baseBranchData } = await github.rest.repos.getBranch({ owner, repo, branch: baseBranch });
                const baseSha = baseBranchData.commit.sha;

                // Create feature branch name and create it from the base branch
                let branchName = `replit/issue-${issue_number}`;
                try {
                  await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha });
                  console.log(`Created branch ${branchName} from ${baseBranch}@${baseSha}`);
                } catch (err) {
                  console.log(`createRef failed: ${err.message}`);
                  branchName = `${branchName}-${Date.now()}`;
                  await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha });
                  console.log(`Created branch ${branchName} instead`);
                }

                // Add a placeholder file on the new branch so the PR has at least one commit
                const timestamp = Date.now();
                const basePath = `.github/replit-placeholders`;
                let placeholderPath = `${basePath}/issue-${issue_number}-${timestamp}.md`;
                const placeholderContent = `# Placeholder for issue #${issue_number}\n\nCreated by workflow at ${new Date().toISOString()}.\n\nThis ensures the branch has an initial commit.`;
                const contentBase64 = Buffer.from(placeholderContent, 'utf8').toString('base64');

                let created = false;
                for (let attempt = 0; attempt < 3 && !created; attempt++) {
                  try {
                    await github.rest.repos.createOrUpdateFileContents({
                      owner,
                      repo,
                      path: placeholderPath,
                      message: `chore: add placeholder for issue #${issue_number}`,
                      content: contentBase64,
                      branch: branchName
                    });
                    created = true;
                    console.log(`Added placeholder file ${placeholderPath} on ${branchName}`);
                  } catch (err) {
                    console.log(`Failed to create ${placeholderPath}: ${err.message}`);
                    placeholderPath = `${basePath}/issue-${issue_number}-${Date.now()}-${attempt}.md`;
                  }
                }

                if (!created) {
                  throw new Error('Could not create placeholder file after several attempts');
                }

                // Create the PR targeting the selected dev base branch
                const { data: pr } = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `Replit-ready: work for issue #${issue_number}`,
                  head: branchName,
                  base: baseBranch,
                  body: `Automated PR created from issue #${issue_number} labeled "replit-ready".`
                });

                console.log(`Created PR: ${pr.html_url}`);

                // Ensure PR body contains a repo-qualified "Closes owner/repo#N"
                const repoQualifiedClose = `Closes ${owner}/${repo}#${issue_number}`;
                const prBodyCurrent = pr.body || '';
                if (!prBodyCurrent.includes(`${owner}/${repo}#${issue_number}`) && !prBodyCurrent.includes(`#${issue_number}`)) {
                  const newBody = prBodyCurrent + '\n\n' + repoQualifiedClose;
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pr.number,
                    body: newBody,
                  });
                  console.log(`Updated PR body to include repo-qualified close reference: ${repoQualifiedClose}`);
                } else if (!prBodyCurrent.includes(`${owner}/${repo}#${issue_number}`) && prBodyCurrent.includes(`#${issue_number}`)) {
                  const newBody = prBodyCurrent + '\n\n' + repoQualifiedClose;
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pr.number,
                    body: newBody,
                  });
                  console.log(`Appended repo-qualified close reference to PR body: ${repoQualifiedClose}`);
                } else {
                  console.log('PR body already contains an issue reference; no update needed.');
                }

                // Comment on the issue with the PR link and repo-qualified close
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Created PR: ${pr.html_url}\n\n${repoQualifiedClose}`
                });

                console.log(`Commented on issue #${issue_number} with PR link and close keyword.`);
              } catch (error) {
                console.error(`Unhandled error: ${error.message}`);
                throw error;
              }
            })();
