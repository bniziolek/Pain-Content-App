# Workflow: create a feature branch + placeholder commit + PR when an issue is labeled "replit-ready"
# Behavior:
# - Trigger: issue labeled
# - Finds the most recently updated branch whose name starts with "dev" (case-insensitive) and uses that branch as the PR base
# - If no "dev*" branch exists the workflow comments on the issue and exits (it will NOT target default branch)
# - Creates feature branch replit/issue-<number> (appends timestamp if exists), adds a placeholder file (initial commit), opens a PR against the chosen dev branch,
#   appends a repo-qualified "Closes owner/repo#<issue>" to the PR body, and comments the PR URL on the issue.
#
# Notes:
# - Workflows must have write permission to contents, issues and pull-requests.
# - This selects the target dev branch by the latest commit timestamp among branches whose name starts with "dev".
# - If you prefer a different selection rule (e.g., alphabetical or explicit target in the issue body), tell me and I can adapt it.

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  issues:
    types: [labeled]

jobs:
  create_branch_and_pr:
    if: github.event.label && github.event.label.name == 'replit-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Create branch, add placeholder commit, and open PR targeting latest dev* branch
        uses: actions/github-script@v6
        with:
          script: |
            (async () => {
              try {
                const addedLabel = context.payload.label && context.payload.label.name;
                if (addedLabel !== 'replit-ready') {
                  console.log(`Added label is "${addedLabel}" — exiting.`);
                  return;
                }

                const issue = context.payload.issue || {};
                const issue_number = issue.number;
                const owner = context.repo.owner;
                const repo = context.repo.repo;

                // 1) List all branches and filter for those starting with 'dev' (case-insensitive)
                const allBranches = await github.paginate(github.rest.repos.listBranches, {
                  owner,
                  repo,
                  per_page: 100
                });

                const devBranches = allBranches.filter(b => /^dev/i.test(b.name));
                if (!devBranches || devBranches.length === 0) {
                  const msg = 'No active branch starting with "dev" was found in the repository. Please create a branch that starts with "dev" (for example "Dev_26.2") before adding the "replit-ready" label.';
                  console.log(msg);
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
                  return;
                }

                // 2) For each candidate dev branch, fetch branch info to get the latest commit timestamp
                const branchesWithDates = [];
                for (const b of devBranches) {
                  try {
                    const { data: branchInfo } = await github.rest.repos.getBranch({ owner, repo, branch: b.name });
                    // Prefer commit.commit.committer.date, fallback to author date
                    const commitObj = branchInfo.commit && branchInfo.commit.commit;
                    const dateStr = (commitObj && (commitObj.committer && commitObj.committer.date)) || (commitObj && commitObj.author && commitObj.author.date) || null;
                    const dateVal = dateStr ? Date.parse(dateStr) : 0;
                    branchesWithDates.push({ name: b.name, date: dateVal });
                  } catch (err) {
                    console.log(`Warning: unable to get branch info for ${b.name}: ${err.message}`);
                    // still include with date 0 to avoid dropping it silently
                    branchesWithDates.push({ name: b.name, date: 0 });
                  }
                }

                // 3) Sort by date descending and pick the most recently updated dev branch
                branchesWithDates.sort((a, b) => b.date - a.date);
                const targetBase = branchesWithDates[0].name;
                console.log(`Selected target base branch: ${targetBase}`);

                // Verify selected base exists (defensive)
                try {
                  await github.rest.repos.getBranch({ owner, repo, branch: targetBase });
                } catch (err) {
                  const msg = `Selected target branch "${targetBase}" does not exist or is inaccessible. Aborting.`;
                  console.log(msg);
                  await github.rest.issues.createComment({ owner, repo, issue_number, body: msg });
                  return;
                }

                // Get commit SHA of the base branch to create the feature branch from
                const { data: baseBranchData } = await github.rest.repos.getBranch({ owner, repo, branch: targetBase });
                const baseSha = baseBranchData.commit.sha;

                // Create feature branch name and create it from the base branch SHA
                let branchName = `replit/issue-${issue_number}`;
                try {
                  await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha });
                  console.log(`Created branch ${branchName} from ${targetBase}@${baseSha}`);
                } catch (err) {
                  console.log(`createRef failed: ${err.message}`);
                  branchName = `${branchName}-${Date.now()}`;
                  await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branchName}`, sha: baseSha });
                  console.log(`Created branch ${branchName} instead`);
                }

                // Create a unique placeholder file path under .github to avoid conflicts and ensure a commit exists
                const timestamp = Date.now();
                const basePath = `.github/replit-placeholders`;
                let placeholderPath = `${basePath}/issue-${issue_number}-${timestamp}.md`;
                const placeholderContent = `# Placeholder for issue #${issue_number}\n\nCreated by workflow at ${new Date().toISOString()}.\n\nThis ensures the branch has an initial commit.`;
                const contentBase64 = Buffer.from(placeholderContent, 'utf8').toString('base64');

                let created = false;
                for (let attempt = 0; attempt < 3 && !created; attempt++) {
                  try {
                    await github.rest.repos.createOrUpdateFileContents({
                      owner,
                      repo,
                      path: placeholderPath,
                      message: `chore: add placeholder for issue #${issue_number}`,
                      content: contentBase64,
                      branch: branchName
                    });
                    created = true;
                    console.log(`Added placeholder file ${placeholderPath} on ${branchName}`);
                  } catch (err) {
                    console.log(`Failed to create ${placeholderPath}: ${err.message}`);
                    placeholderPath = `${basePath}/issue-${issue_number}-${Date.now()}-${attempt}.md`;
                  }
                }

                if (!created) {
                  throw new Error('Could not create placeholder file after several attempts');
                }

                // Create the PR targeting the chosen dev base branch
                const { data: pr } = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `Replit-ready: work for issue #${issue_number}`,
                  head: branchName,
                  base: targetBase,
                  body: `Automated PR created from issue #${issue_number} labeled "replit-ready".`
                });

                console.log(`Created PR: ${pr.html_url}`);

                // Ensure PR body contains a repo-qualified "Closes owner/repo#N"
                const repoQualifiedClose = `Closes ${owner}/${repo}#${issue_number}`;
                const prBodyCurrent = pr.body || '';
                if (!prBodyCurrent.includes(`${owner}/${repo}#${issue_number}`) && !prBodyCurrent.includes(`#${issue_number}`)) {
                  const newBody = prBodyCurrent + '\n\n' + repoQualifiedClose;
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pr.number,
                    body: newBody,
                  });
                  console.log(`Updated PR body to include repo-qualified close reference: ${repoQualifiedClose}`);
                } else if (!prBodyCurrent.includes(`${owner}/${repo}#${issue_number}`) && prBodyCurrent.includes(`#${issue_number}`)) {
                  const newBody = prBodyCurrent + '\n\n' + repoQualifiedClose;
                  await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: pr.number,
                    body: newBody,
                  });
                  console.log(`Appended repo-qualified close reference to PR body: ${repoQualifiedClose}`);
                } else {
                  console.log('PR body already contains an issue reference; no update needed.');
                }

                // Comment on the issue with the PR link and repo-qualified close
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body: `Created PR: ${pr.html_url}\n\n${repoQualifiedClose}`
                });

                console.log(`Commented on issue #${issue_number} with PR link and close keyword.`);
              } catch (error) {
                console.error(`Unhandled error: ${error.message}`);
                throw error;
              }
            })();
